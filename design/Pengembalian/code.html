<main class="mt-28 px-margin-mobile max-w-2xl mx-auto space-y-lg">
<!-- Header Section -->

<div class="h-1 w-12 bg-[#005394] mt-2 rounded-full"></div>
<p class="font-body-md text-on-surface-variant mt-4">Lengkapi data di bawah ini untuk memproses retur perangkat ke logistik.</p></section>
<!-- Form Section -->
<form class="space-y-6 fade-in" style="animation-delay: 0.1s;">
<!-- ID Pelanggan -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="id-pelanggan">ID Pelanggan</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">search</span>
<input class="w-full h-[56px] pl-12 pr-4 bg-white border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none executive-shadow font-body-md text-body-md" id="id-pelanggan" placeholder="Cari ID atau Nama Pelanggan..." type="text"/>
</div>
</div>
<!-- Serial Number -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="sn-perangkat">Pilih Serial Number Alat</label>
<div class="relative group">
<input class="w-full h-[56px] px-4 bg-white border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none executive-shadow font-body-md text-body-md" id="sn-perangkat" placeholder="Masukkan Serial Number (SN)..." type="text"/>
</div>
</div>
<!-- Alasan -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="alasan">Alasan Pengembalian/Kerusakan</label>
<textarea class="w-full p-4 bg-white border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none executive-shadow font-body-md text-body-md resize-none" id="alasan" placeholder="Contoh: Port LAN mati, terkena petir, redaman tinggi..." rows="4"></textarea>
</div>
<!-- Photo Upload -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">Bukti Foto Kerusakan</label>

<input accept="image/*" class="hidden" id="photo-upload" type="file"/>
<label class="flex flex-col items-center justify-center w-full h-[180px] bg-white border-2 border-dashed border-outline-variant rounded-xl executive-shadow group-hover:border-primary group-hover:bg-primary/5 transition-all duration-300" for="photo-upload">
<span class="material-symbols-outlined text-primary text-[48px] mb-base">photo_camera</span>

<span class="material-symbols-outlined">settings_input_component</span>
<span class="font-label-sm text-label-sm">Dismantle</span>
</a>

<script>
    // Photo preview logic
    const photoInput = document.getElementById('photo-upload');
    const previewArea = document.getElementById('preview-area');
    const imgPreview = document.getElementById('img-preview');
    const removePhotoBtn = document.getElementById('remove-photo');

    photoInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                imgPreview.src = event.target.result;
                previewArea.classList.remove('hidden');
            }
            reader.readAsDataURL(file);
        }
    });

    removePhotoBtn.addEventListener('click', function() {
        photoInput.value = '';
        imgPreview.src = '';
        previewArea.classList.add('hidden');
    });

    // Form submission
    document.querySelector('form').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        const originalContent = btn.innerHTML;
        
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Memproses...';
        btn.disabled = true;
        btn.classList.add('opacity-80');

        setTimeout(() => {
            alert('Pengembalian berhasil diajukan! Menunggu verifikasi admin.');
            btn.innerHTML = originalContent;
            btn.disabled = false;
            btn.classList.remove('opacity-80');
            e.target.reset();
            previewArea.classList.add('hidden');
        }, 1500);
    });
</script>
